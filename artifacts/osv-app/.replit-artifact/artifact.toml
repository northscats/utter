kind = "web"
previewPath = "/"
title = "ОСВ Дашборд"
version = "1.0.0"
id = "artifacts/osv-app"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/1c", "/limit-notifications" ]
localPort = 21844

[services.development]
run = "bash scripts/run-osv.sh"

[services.production]
build = [ "python3", "../../osv-dashboard/check_runtime_dependencies.py" ]
run = [ "bash", "scripts/run-osv.sh" ]

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "21844"
BASE_PATH = "/"