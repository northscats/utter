kind = "web"
previewPath = "/"
title = "ОСВ Дашборд"
version = "1.0.0"
id = "artifacts/osv-app"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/1c" ]
localPort = 21844

[services.development]
run = "cd /home/runner/workspace/osv-dashboard && python3 -m gunicorn -c gunicorn.conf.py app:app"

[services.production]
build = [ "python3", "/home/runner/workspace/osv-dashboard/check_runtime_dependencies.py" ]
run = [ "bash", "-c", "cd /home/runner/workspace/osv-dashboard && exec python3 -m gunicorn -c gunicorn.conf.py app:app" ]

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "21844"
BASE_PATH = "/"