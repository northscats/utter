# Фрагмент конфигурации nginx для размещения ОСВ Дашборда по адресу /osv
# Вставьте этот блок внутрь вашего существующего server {} в /etc/nginx/sites-available/ваш-домен.conf

server {
    listen 80;
    server_name домен.ru www.домен.ru;

    # ... ваши существующие location-блоки ...

    # ОСВ Дашборд — проксируется с /osv на gunicorn
    location /osv/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Script-Name     /osv;
        proxy_set_header   X-KI-Request-ID   $http_x_ki_request_id;

        # Загрузка файлов до 100 МБ
        client_max_body_size 100m;

        # Таймаут для длинных парсингов
        proxy_read_timeout 120s;
    }

    # Статичные файлы (если захотите раздавать через nginx напрямую)
    # location /osv/static/ {
    #     alias /opt/osv-dashboard/static/;
    # }
}
