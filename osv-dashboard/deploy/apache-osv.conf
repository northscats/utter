# Фрагмент VirtualHost для Apache2
# Требуются модули: proxy proxy_http headers rewrite
# Включить: a2enmod proxy proxy_http headers rewrite

# Редирект /osv → /osv/ (без слеша на конце браузер теряет контекст)
RedirectMatch ^/osv$ /osv/

# Проксирование — префикс НЕ срезаем, передаём как есть
ProxyPass        /osv/  http://127.0.0.1:4545/osv/
ProxyPassReverse /osv/  http://127.0.0.1:4545/osv/

# Передаём протокол и порт приложению (для url_for с https)
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
RequestHeader set X-Forwarded-Port  expr=%{SERVER_PORT}
