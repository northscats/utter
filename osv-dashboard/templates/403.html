<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ запрещён — ГИС УЗТЭР</title>
<style>
:root{--ink:#1b2733;--mut:#6b7a86;--paper:#e9edf0;--bad:#bf3222}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;max-width:400px;padding:32px}
.code{font-size:72px;font-weight:700;color:#d3dade;line-height:1}
h1{font-size:20px;margin:16px 0 8px;color:var(--ink)}
p{color:var(--mut);font-size:14px;margin-bottom:24px}
a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;
  border-radius:8px;padding:10px 24px;font-weight:600;font-size:14px}
a:hover{opacity:.85}
</style>
</head>
<body>
<div class="box">
  <div class="code">403</div>
  <h1>Доступ запрещён</h1>
  <p>Эта страница доступна только администраторам системы.</p>
  <a href="/home">← На главную</a>
</div>
</body>
</html>
