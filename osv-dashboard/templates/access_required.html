<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body{font:16px/1.5 system-ui,sans-serif;background:#edf2ef;color:#20343d;margin:0}

  </style>
</head>
<body><main>
  <h1>Нет назначенного рабочего кабинета</h1>

  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Безопасно выйти</button>
  </form>
</main></body>
</html>
