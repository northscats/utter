<nav class="limits-tabs" aria-label="Разделы модуля лимитов">
  <a href="{{ url_for('limit_notifications', dataset=dataset.id if dataset else none) }}" {% if request.endpoint=='limit_notifications' %}aria-current="page"{% endif %}>Обзор и загрузки</a>
  {% if dataset %}
  <a href="{{ url_for('limit_objects', dataset_id=dataset.id) }}" {% if request.endpoint=='limit_objects' %}aria-current="page"{% endif %}>Объекты</a>
  {% else %}
  <span title="Сначала создайте набор отчётности">Объекты</span>
  {% endif %}
  <a href="{{ url_for('limit_dashboard', dataset=dataset.id if dataset else none) }}" {% if request.endpoint=='limit_dashboard' %}aria-current="page"{% endif %}>Дашборд</a>
  <a href="{{ url_for('max_limits', dataset=dataset.id if dataset else none) }}" {% if request.endpoint=='max_limits' %}aria-current="page"{% endif %}>Бот MAX</a>
</nav>
<style>
.limits-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 28px;border-bottom:1px solid var(--line);padding-bottom:10px}
.limits-tabs a,.limits-tabs span{padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:650;color:var(--mut)}
.limits-tabs a:hover{background:#eaf5f8;color:var(--blue)}
.limits-tabs a[aria-current="page"]{background:var(--blue);color:#fff}
.limits-tabs span{opacity:.5}
</style>
