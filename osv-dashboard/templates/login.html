<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — ГИС МО «Управление задолженностью за ТЭР»</title>
<style>
:root{--blue:#003f8a;--blue-mid:#1a6ec8;--ink:#0a1828;--mut:#6a8aaa;--paper:#f4f6f9;--panel:#fff;--line:#d0d8e4;--water:#1f7a9c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column}
 .top-stripe{height:5px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-mid) 60%,#2ca4e8 100%);flex-shrink:0}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 56px;
  display:flex;align-items:center;gap:16px;flex-shrink:0}
.logo-box{width:42px;height:42px;border-radius:11px;background:var(--blue);display:flex;
  align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,63,138,.22);flex-shrink:0}
.logo-name{font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.01em}
.logo-sub{font-size:11px;color:var(--mut);margin-top:1px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:36px 40px;
  width:100%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
h2{font-size:16px;font-weight:700;margin-bottom:24px;color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;color:#31424f;margin-bottom:5px}
input[type=text],input[type=password]{display:block;width:100%;padding:10px 12px;
  border:1px solid var(--line);border-radius:7px;font:15px 'Segoe UI',sans-serif;
  color:var(--ink);background:#fff;margin-bottom:16px;outline:none;transition:border .15s}
input:focus{border-color:var(--water);box-shadow:0 0 0 3px #1f7a9c18}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;
  padding:12px;font:600 14px 'Segoe UI',sans-serif;cursor:pointer;letter-spacing:.04em;
  margin-top:4px;transition:background .15s}
.btn:hover{background:#253545}
.err{background:#fbeae8;border:1px solid #e7b6b0;color:#7c2018;border-radius:7px;
  padding:10px 14px;margin-bottom:18px;font-size:14px}
</style>
</head>
<body>
<div class="top-stripe"></div>
<header>
  <a href="/" style="display:flex;align-items:center;text-decoration:none;gap:0;margin-right:12px">
    <span style="font-size:12px;color:var(--mut);white-space:nowrap">← Главная</span>
  </a>
  <div class="logo-box">
    <svg width="22" height="22" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 26 L21 33 H24 L22 40 L30 31 H27 L29 26 Z" fill="#6dd8ff"/>
      <path d="M24 8 L21 15 H24 L22 22 L30 13 H27 L29 8 Z" fill="white" opacity=".85"/>
    </svg>
  </div>
  <div>
    <div class="logo-name">ГИС УЗТЭР</div>
    <div class="logo-sub">Московская область</div>
  </div>
</header>
<main>
  <div class="card">
    <h2>Вход в систему</h2>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" autocomplete="username" required
             value="{{ username or '' }}">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</main>
</body>
</html>
