<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — ГИС УЗТЭР</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#003f8a;--blue-mid:#1a6ec8;--blue-lt:#2ca4e8;--ink:#0a1828;--mut:#6a8aaa;--line:#d0d8e4;--paper:#f4f6f9;--panel:#fff;--water:#1f7a9c}
body{background:var(--paper);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* BG accents — как на лендинге */
.bg-right{position:fixed;top:0;right:0;width:55%;height:100%;background:linear-gradient(140deg,rgba(26,110,200,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
.bg-blob{position:fixed;bottom:0;left:0;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(26,110,200,.06) 0%,transparent 70%);pointer-events:none;z-index:0}

/* Top stripe */
.top-stripe{height:5px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-mid) 60%,var(--blue-lt) 100%);flex-shrink:0;position:relative;z-index:1}

/* Header */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 56px;display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative;z-index:1}
.hd-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);text-decoration:none;margin-right:4px;transition:color .15s;white-space:nowrap}
.hd-back:hover{color:var(--blue)}
.hd-back svg{flex-shrink:0}
.logo-box{width:42px;height:42px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,63,138,.22);flex-shrink:0}
.logo-name{font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.01em}
.logo-sub{font-size:11px;color:var(--mut);margin-top:1px}
.hd-spacer{flex:1}

/* Main */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 48px 48px;position:relative;z-index:1}

/* Hero icon */
.hero-icon{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-mid) 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 36px rgba(0,63,138,.24);margin-bottom:28px;flex-shrink:0}

/* Titles */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;text-align:center}
.page-title{font-size:26px;font-weight:800;line-height:1.25;text-align:center;letter-spacing:-.01em;margin-bottom:6px}
.page-title .accent{color:var(--blue-mid)}
.page-sub{font-size:13px;color:var(--mut);text-align:center;margin-bottom:36px}

/* Login card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,63,138,.09)}

label{display:block;font-size:13px;font-weight:600;color:#31424f;margin-bottom:5px}
input[type=text],input[type=password]{
  display:block;width:100%;padding:11px 13px;
  border:1.5px solid var(--line);border-radius:8px;
  font:15px 'Segoe UI',sans-serif;color:var(--ink);background:#fff;
  margin-bottom:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(26,110,200,.12)}

.btn{display:block;width:100%;background:var(--blue);color:#fff;border:none;border-radius:9px;
  padding:13px;font:700 14px 'Segoe UI',sans-serif;cursor:pointer;letter-spacing:.03em;
  margin-top:4px;transition:background .18s,box-shadow .18s;box-shadow:0 4px 16px rgba(0,63,138,.24)}
.btn:hover{background:#00337a;box-shadow:0 6px 24px rgba(0,63,138,.34)}

.err{background:#fbeae8;border:1px solid #e7b6b0;color:#7c2018;border-radius:8px;
  padding:10px 14px;margin-bottom:18px;font-size:13px;line-height:1.4}

/* Footer */
footer{background:var(--panel);border-top:1px solid var(--line);padding:15px 56px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:#aab4c0;flex-shrink:0;position:relative;z-index:1;flex-wrap:wrap;gap:8px}

@media(max-width:640px){
  header{padding:14px 20px}
  main{padding:40px 20px 32px}
  .card{padding:28px 20px}
  .page-title{font-size:20px}
  footer{padding:14px 20px;flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<div class="bg-right"></div>
<div class="bg-blob"></div>

<div class="top-stripe"></div>

<header>
  <div class="logo-box">
    <svg width="22" height="22" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 26 L21 33 H24 L22 40 L30 31 H27 L29 26 Z" fill="#6dd8ff"/>
      <path d="M24 8 L21 15 H24 L22 22 L30 13 H27 L29 8 Z" fill="white" opacity=".85"/>
    </svg>
  </div>
  <div>
    <div class="logo-name">ГИС УЗТЭР</div>
    <div class="logo-sub">Московская область</div>
  </div>
  <div class="hd-spacer"></div>
  <a class="hd-back" href="/">
    <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 16l-6-6 6-6"/>
    </svg>
    Главная
  </a>
</header>

<main>
  <div class="hero-icon">
    <svg width="38" height="38" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <rect x="8" y="22" width="32" height="20" rx="3" stroke="white" stroke-width="1.8"/>
      <path d="M16 22V17a8 8 0 0 1 16 0v5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="24" cy="32" r="2.8" fill="#6dd8ff"/>
      <path d="M24 32v3" stroke="#6dd8ff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="eyebrow">Государственная информационная система</div>

  <h1 class="page-title">
    Вход в <span class="accent">ГИС УЗТЭР</span>
  </h1>
  <p class="page-sub">Введите логин и пароль для доступа к системе</p>

  <div class="card">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="login_csrf_token" value="{{ login_csrf_token }}">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" autocomplete="username" required
             value="{{ username or '' }}">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Войти в систему</button>
    </form>
  </div>
</main>

<footer>
  <span>© 2026 Московская область · Министерство энергетики</span>
  <span>ГИС УЗТЭР · v1.0</span>
</footer>
</body>
</html>
