{% extends "base.html" %}
{% block title %}Ошибка сервера — ГИС УЗТЭР{% endblock %}
{% block content %}
<main style="display:flex;justify-content:center;align-items:center;min-height:60vh">
  <div style="text-align:center;max-width:480px">
    <div style="font-size:64px;line-height:1;margin-bottom:16px">⚙️</div>
    <h2 style="font-size:22px;font-weight:700;margin-bottom:8px">Внутренняя ошибка сервера</h2>
    <p style="color:#666;font-size:14px;margin-bottom:24px">
      Что-то пошло не так на стороне сервера. Технический журнал уже записан.
      Повторите попытку позже или обратитесь к администратору.
    </p>
    <a href="/home" style="display:inline-block;background:var(--water,#4a9ab5);color:#fff;
       padding:10px 24px;border-radius:8px;text-decoration:none;font-size:14px">
      ← На главную
    </a>
  </div>
</main>
{% endblock %}
