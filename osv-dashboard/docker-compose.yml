version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-osv_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osv_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4545}:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osv_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-osv_db}
      SESSION_SECRET: ${SESSION_SECRET}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SCRIPT_NAME: ${SCRIPT_NAME:-/osv}
      MAX_LIMITS_WEBHOOK_URL: ${MAX_LIMITS_WEBHOOK_URL:-}
      MAX_LIMITS_REQUIRE_WEBHOOK: "1"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads
      - output_data:/app/output
      - max_bot_private:/app/private
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  output_data:
  max_bot_private:
