name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false # Отключаем скачивание LFS файлов

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # 1. Отключаем проверку самоподписанного сертификата
          git config --global http.sslVerify false

          # 2. Игнорируем отсутствие бинарников LFS при отправке
          git config lfs.allowincompletepush true

          # 3. Добавляем удаленный репозиторий
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@185.11.49.226:2443/EmelianovMaM/uzter.git"

          # 4. Отправляем только код, ветки и теги
          git push gitlab --prune +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/* -o ci.skip
