name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git config --global http.sslVerify false # если используется самоподписанный сертификат
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.example.com/EmelianovMaM/uzter.git
          git push gitlab --prune +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
